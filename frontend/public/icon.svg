<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e0a1a" />
      <stop offset="100%" stop-color="#090308" />
    </radialGradient>
    <radialGradient id="heartGrad" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="40%" stop-color="#e11d48" />
      <stop offset="85%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4c0519" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Pulse Glow -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(225, 29, 72, 0.2)" stroke-width="2" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(225, 29, 72, 0.35)" stroke-width="3" />

  <!-- Main Romantic Heart -->
  <g filter="url(#glow)">
    <path d="M 256,160 
             A 65,65 0,0,0 135,185 
             C 135,260 215,315 256,375 
             C 297,315 377,260 377,185 
             A 65,65 0,0,0 256,160 Z" 
          fill="url(#heartGrad)" 
          stroke="#fbcfe8" 
          stroke-width="5" />
  </g>

  <!-- Arterial ECG Wave traversing heart -->
  <path d="M 120,270 L 200,270 L 215,245 L 235,305 L 255,200 L 275,310 L 295,255 L 310,270 L 392,270" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="drop-shadow(0 0 8px #f43f5e)" />
</svg>
