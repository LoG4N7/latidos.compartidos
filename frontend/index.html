<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Primary Meta Tags -->
    <title>Latidos Compartidos • Demian & Verónica</title>
    <meta name="description" content="Sincronización biométrica e íntima de latidos en tiempo real para Demian & Verónica" />
    <meta name="theme-color" content="#090308" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    
    <!-- iOS Safari Web App Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Latidos" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    
    <!-- Android Chrome Theme -->
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body class="bg-[#090308] text-rose-100 overflow-x-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('[PWA] Service Worker registrado:', reg.scope))
            .catch((err) => console.warn('[PWA] Error al registrar Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
