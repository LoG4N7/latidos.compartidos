name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 21 (Requerido por Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Aceptar Licencias de Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Instalar Dependencias del Monorepo
        run: |
          npm --prefix backend install
          npm --prefix frontend install

      - name: Compilar Frontend Vite
        run: npm --prefix frontend run build

      - name: Sincronizar Capacitor Android
        run: |
          cd frontend
          npx cap sync android

      - name: Compilar APK Android (assembleDebug)
        run: |
          cd frontend/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: Latidos-Compartidos-Demian-Veronica-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
