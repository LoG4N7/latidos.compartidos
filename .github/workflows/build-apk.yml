name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java 17 (Requerido por Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Dependencias del Monorepo
        run: |
          npm --prefix backend install
          npm --prefix frontend install

      - name: Compilar Frontend Vite
        run: npm --prefix frontend run build

      - name: Sincronizar Capacitor Android
        run: |
          cd frontend
          npx cap sync android

      - name: Dar permisos de ejecución a Gradlew
        run: chmod +x frontend/android/gradlew

      - name: Compilar APK Android (assembleDebug)
        run: |
          cd frontend/android
          ./gradlew assembleDebug --stacktrace

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: Latidos-Compartidos-Demian-Veronica-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
