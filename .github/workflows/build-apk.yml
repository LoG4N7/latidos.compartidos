name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 21 (Requerido por Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Aceptar Licencias de Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Instalar Dependencias del Monorepo
        run: |
          npm --prefix backend install
          npm --prefix frontend install

      - name: Compilar Frontend Vite
        run: npm --prefix frontend run build

      - name: Sincronizar Capacitor Android
        run: |
          cd frontend
          npx cap sync android

      - name: Compilar APK Android (assembleDebug)
        run: |
          cd frontend/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar archivo APK para descarga
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk Latidos-Compartidos.apk

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: Latidos-Compartidos-Demian-Veronica-APK
          path: Latidos-Compartidos.apk
          retention-days: 30

      - name: Publicar GitHub Release con Descarga Directa
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Latidos Compartidos APK (Última Versión)"
          body: |
            ❤️ **Latidos Compartidos - Demian y Verónica**

            Descarga directa del APK para instalar en tu teléfono Android:
            - Pulsa en **`Latidos-Compartidos.apk`** para descargar directamente.
            - Al finalizar la descarga, toca la notificación y presiona **Actualizar**.

            ✨ *Incluye sincronización 24/7 con Xiaomi Smart Band 9 y widget de Pulsoid.*
          files: Latidos-Compartidos.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
